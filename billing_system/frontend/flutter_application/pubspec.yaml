name: billing_system
description: ERP Mobile Billing System - Professional POS for Android tablets and mobile devices.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # HTTP client
  http: ^1.2.1

  # Date formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.6

  # Local session / settings storage
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
